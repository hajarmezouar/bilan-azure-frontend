name: Frontend CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        type: choice
        options:
          - nonprod
          - prod

permissions:
  contents: read

concurrency:
  group: frontend-${{ inputs.environment || 'nonprod' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: azure-quiz-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint application
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Build production application
        run: npm run build:prod

  deploy:
    name: Deploy ${{ inputs.environment || 'nonprod' }}
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'nonprod' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build frontend container
        env:
          API_BASE_URL: ${{ vars.BACKEND_URL }}/api
        run: docker build --build-arg API_BASE_URL="${API_BASE_URL}" --tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          timeout: 15m0s

      - name: Push immutable image to Azure Container Registry
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: |
          LOGIN_SERVER="${ACR_NAME}.azurecr.io"
          docker tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" "${LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker push "${LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Deploy image to Azure Web App
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          LOGIN_SERVER="${ACR_NAME}.azurecr.io"
          az webapp config container set \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WEBAPP_NAME}" \
            --container-image-name "${LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            --container-registry-url "https://${LOGIN_SERVER}" \
            --output none
          az webapp start --resource-group "${RESOURCE_GROUP}" --name "${WEBAPP_NAME}"

      - name: Verify frontend
        env:
          FRONTEND_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 "${FRONTEND_URL}" >/dev/null; then
              echo "Frontend is healthy at ${FRONTEND_URL}" >> "${GITHUB_STEP_SUMMARY}"
              break
            fi
            if [ "${attempt}" = "30" ]; then
              echo "Frontend did not become available: ${FRONTEND_URL}" >&2
              exit 1
            fi
            sleep 20
          done
          curl --fail --silent --show-error --max-time 15 "${BACKEND_URL}/actuator/health"
          {
            echo "### Frontend ${{ inputs.environment || 'nonprod' }} deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Frontend: ${FRONTEND_URL}"
            echo "- Backend: ${BACKEND_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Sign out from Azure
        if: always()
        continue-on-error: true
        run: az logout

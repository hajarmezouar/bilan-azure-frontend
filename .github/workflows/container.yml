name: Security - Container

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-scan:
    name: Trivy container and configuration scan
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: azure-quiz-frontend:security-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The frontend Dockerfile requires these build arguments.
      # Dummy values are sufficient because this image is only used
      # locally by the security scanner and is never deployed.
      - name: Build frontend security image
        run: |
          docker build \
            --build-arg API_BASE_URL="https://example.invalid/api" \
            --build-arg API_KEY="security-scan-placeholder" \
            --tag "${IMAGE_NAME}" \
            .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          timeout: 15m0s

      - name: Scan Docker configuration with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Publish container security summary
        if: always()
        run: |
          {
            echo "### Frontend container security"
            echo "- Tool: Trivy"
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Image vulnerabilities: HIGH/CRITICAL"
            echo "- Configuration issues: HIGH/CRITICAL"
            echo "- Fixable HIGH/CRITICAL image vulnerabilities: blocking"
            echo "- HIGH/CRITICAL configuration findings: blocking"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
